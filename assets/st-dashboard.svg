    <rect x="100" y="896" width="200" height="44" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <circle cx="118" cy="918" r="11" fill="#dee1e6"/>
    <text x="118" y="922" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">A</text>
    <text x="138" y="914" font-size="10" fill="#3a4049" font-weight="600">Admin</text>
    <text x="138" y="928" font-size="9" fill="#9aa1aa">Station WEAPONX</text>
