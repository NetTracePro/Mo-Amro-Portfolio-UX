    <text x="626" y="295" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">H2 — Open the register to start ringing up orders</text>
    <rect x="356" y="316" width="320" height="14" fill="#5e6873"/>
    <text x="356" y="326" font-size="9" fill="#cdd0d4">SUBTITLE — Quick, calm, and out of your way.</text>

