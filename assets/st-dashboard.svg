      <text x="612" y="466" font-size="9" fill="#7d8590">TRANSACTIONS</text>
      <rect x="812" y="452" width="20" height="20" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="612" y="510" font-size="20" fill="#3a4049" font-weight="700">47</text>
      <text x="612" y="540" font-size="9" fill="#5cb85c">↑ +8 since open</text>

