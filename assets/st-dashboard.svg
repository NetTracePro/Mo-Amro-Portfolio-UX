  </g>

  <!-- Top annotation about layout choice -->
  <text x="320" y="370" font-size="10" fill="#c14545">[ POS-first dashboard: hero CTA banner pushed above metrics so cashiers can start ringing in &lt; 1 second after login ]</text>

</svg>