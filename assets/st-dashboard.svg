      <text x="888" y="638" font-size="11" fill="#3a4049" font-weight="600">Recent transactions</text>
      <text x="1376" y="638" font-size="9" fill="#5e7eb6" text-anchor="end">View all →</text>
      <line x1="868" y1="650" x2="1396" y2="650" stroke="#e2e5e9" stroke-width="1"/>

      <!-- Transaction list rows -->
      <g>
        <rect x="888" y="664" width="488" height="42" fill="#fafbfc" stroke="#e2e5e9" stroke-width="1"/>
        <circle cx="908" cy="685" r="11" fill="#dee1e6"/>
        <rect x="930" y="676" width="160" height="10" fill="#dee1e6"/>
        <rect x="930" y="690" width="100" height="8" fill="#eef0f3"/>
        <text x="1356" y="690" font-size="10" fill="#3a4049" font-weight="600" text-anchor="end">$24.50</text>

        <rect x="888" y="714" width="488" height="42" fill="#fafbfc" stroke="#e2e5e9" stroke-width="1"/>
        <circle cx="908" cy="735" r="11" fill="#dee1e6"/>
        <rect x="930" y="726" width="180" height="10" fill="#dee1e6"/>
        <rect x="930" y="740" width="80" height="8" fill="#eef0f3"/>
        <text x="1356" y="740" font-size="10" fill="#3a4049" font-weight="600" text-anchor="end">$18.25</text>

        <rect x="888" y="764" width="488" height="42" fill="#fafbfc" stroke="#e2e5e9" stroke-width="1"/>
        <circle cx="908" cy="785" r="11" fill="#dee1e6"/>
        <rect x="930" y="776" width="140" height="10" fill="#dee1e6"/>
        <rect x="930" y="790" width="120" height="8" fill="#eef0f3"/>
        <text x="1356" y="790" font-size="10" fill="#3a4049" font-weight="600" text-anchor="end">$36.00</text>

        <rect x="888" y="814" width="488" height="42" fill="#fafbfc" stroke="#e2e5e9" stroke-width="1"/>
        <circle cx="908" cy="835" r="11" fill="#dee1e6"/>
        <rect x="930" y="826" width="170" height="10" fill="#dee1e6"/>
        <rect x="930" y="840" width="90" height="8" fill="#eef0f3"/>
        <text x="1356" y="840" font-size="10" fill="#3a4049" font-weight="600" text-anchor="end">$9.75</text>

        <rect x="888" y="864" width="488" height="42" fill="#fafbfc" stroke="#e2e5e9" stroke-width="1"/>
        <circle cx="908" cy="885" r="11" fill="#dee1e6"/>
        <rect x="930" y="876" width="150" height="10" fill="#dee1e6"/>
        <rect x="930" y="890" width="110" height="8" fill="#eef0f3"/>
        <text x="1356" y="890" font-size="10" fill="#3a4049" font-weight="600" text-anchor="end">$42.10</text>
      </g>
