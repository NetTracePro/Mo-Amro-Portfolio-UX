<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1000" preserveAspectRatio="xMidYMin meet" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace">

  <rect width="1480" height="1000" fill="#f7f7f8"/>
  <rect x="40" y="40" width="1400" height="920" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>

  <!-- Title strip -->
  <rect x="40" y="40" width="1400" height="44" fill="#eef0f3" stroke="#cdd0d4" stroke-width="1"/>
  <text x="68" y="68" font-size="12" fill="#3a4049" font-weight="600">WIREFRAME — Dashboard</text>
  <text x="1412" y="68" font-size="11" fill="#7d8590" text-anchor="end">SimpleTouch POS · post-login overview · 1280 × 800</text>

  <!-- Browser chrome -->
  <rect x="80" y="120" width="1320" height="36" fill="#eef0f3" stroke="#cdd0d4" stroke-width="1"/>
  <circle cx="100" cy="138" r="5" fill="#d8dde3"/>
  <circle cx="118" cy="138" r="5" fill="#d8dde3"/>
  <circle cx="136" cy="138" r="5" fill="#d8dde3"/>
  <rect x="160" y="128" width="380" height="20" rx="4" fill="#ffffff" stroke="#d8dde3" stroke-width="1"/>
  <text x="175" y="142" font-size="11" fill="#7d8590">app.simpletouchpos.com/dashboard</text>

  <!-- ============ SIDEBAR ============ -->
  <g>
    <rect x="80" y="156" width="240" height="800" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>

    <!-- Logo block -->
    <rect x="100" y="180" width="200" height="48" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="200" y="208" font-size="10" fill="#7d8590" text-anchor="middle">LOGO + WORDMARK</text>

    <!-- Section label -->
    <text x="100" y="265" font-size="9" fill="#9aa1aa" font-weight="600">MAIN</text>

    <!-- Nav items -->
    <rect x="100" y="280" width="200" height="36" fill="#dee1e6"/>
    <rect x="112" y="290" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="302" font-size="11" fill="#3a4049" font-weight="600">Dashboard</text>

    <!-- Featured: POS (highlighted to draw eye) -->
    <rect x="100" y="324" width="200" height="36" fill="#1a1d24"/>
    <rect x="112" y="334" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="135" y="346" font-size="11" fill="#ffffff" font-weight="600">Point of Sale</text>
    <rect x="265" y="332" width="28" height="18" rx="4" fill="#ffffff"/>
    <text x="279" y="345" font-size="9" fill="#1a1d24" text-anchor="middle">⌘P</text>

    <rect x="100" y="368" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="378" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="390" font-size="11" fill="#3a4049">Inventory</text>

    <rect x="100" y="412" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="422" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="434" font-size="11" fill="#3a4049">Reports</text>

    <rect x="100" y="456" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="466" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="478" font-size="11" fill="#3a4049">Customers</text>

    <text x="100" y="525" font-size="9" fill="#9aa1aa" font-weight="600">CONFIGURE</text>

    <rect x="100" y="540" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="550" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="562" font-size="11" fill="#3a4049">Categories &amp; Items</text>

    <rect x="100" y="584" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="594" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="606" font-size="11" fill="#3a4049">Suppliers</text>

    <rect x="100" y="628" width="200" height="36" fill="#ffffff"/>
    <rect x="112" y="638" width="14" height="14" fill="none" stroke="#7d8590" stroke-width="1"/>
    <text x="135" y="650" font-size="11" fill="#3a4049">Settings</text>

