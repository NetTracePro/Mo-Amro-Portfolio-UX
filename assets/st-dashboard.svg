  <!-- Sidebar annotations -->
  <g fill="#c14545" font-size="10">
    <line x1="60" y1="342" x2="100" y2="342" stroke="#c14545" stroke-width="1"/>
    <text x="55" y="335" text-anchor="end">Highlighted nav item =</text>
    <text x="55" y="349" text-anchor="end">most-used screen, even when</text>
    <text x="55" y="363" text-anchor="end">user is on dashboard</text>
  </g>

  <!-- ============ MAIN CONTENT ============ -->
  <g>
    <!-- Topbar -->
    <rect x="320" y="156" width="1080" height="56" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <text x="340" y="190" font-size="10" fill="#9aa1aa">Home /</text>
    <text x="372" y="190" font-size="11" fill="#3a4049" font-weight="600">Dashboard</text>

    <!-- Search -->
    <rect x="780" y="172" width="280" height="28" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
    <text x="795" y="190" font-size="10" fill="#9aa1aa">Search…</text>

    <!-- Topbar icon buttons -->
    <rect x="1080" y="172" width="28" height="28" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <text x="1094" y="190" font-size="10" fill="#7d8590" text-anchor="middle">🔔</text>
    <rect x="1118" y="172" width="28" height="28" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
