      <text x="884" y="466" font-size="9" fill="#7d8590">AVG TICKET</text>
      <rect x="1084" y="452" width="20" height="20" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="884" y="510" font-size="20" fill="#3a4049" font-weight="700">$27.32</text>
      <text x="884" y="540" font-size="9" fill="#5cb85c">↑ +$2.10</text>

