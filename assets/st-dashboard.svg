        <rect x="340" y="670" width="155" height="76" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
        <rect x="354" y="684" width="22" height="22" fill="#f0c89c"/>
        <text x="354" y="724" font-size="10" fill="#3a4049" font-weight="600">New sale</text>
