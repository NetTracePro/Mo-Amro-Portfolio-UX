        <text x="524" y="724" font-size="10" fill="#3a4049" font-weight="600">Add item</text>
        <text x="524" y="736" font-size="8" fill="#9aa1aa">Menu builder</text>

        <rect x="680" y="670" width="155" height="76" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
        <rect x="694" y="684" width="22" height="22" fill="#c5e1c5"/>
        <text x="694" y="724" font-size="10" fill="#3a4049" font-weight="600">Daily report</text>
        <text x="694" y="736" font-size="8" fill="#9aa1aa">Z-out summary</text>

        <rect x="340" y="760" width="155" height="76" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
        <rect x="354" y="774" width="22" height="22" fill="#f5d6a8"/>
        <text x="354" y="814" font-size="10" fill="#3a4049" font-weight="600">Open drawer</text>
        <text x="354" y="826" font-size="8" fill="#9aa1aa">No-sale</text>

        <rect x="510" y="760" width="155" height="76" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
        <rect x="524" y="774" width="22" height="22" fill="#bcd0e6"/>
        <text x="524" y="814" font-size="10" fill="#3a4049" font-weight="600">Add customer</text>
        <text x="524" y="826" font-size="8" fill="#9aa1aa">CRM</text>

        <rect x="680" y="760" width="155" height="76" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
        <rect x="694" y="774" width="22" height="22" fill="#dee1e6"/>
        <text x="694" y="814" font-size="10" fill="#3a4049" font-weight="600">Settings</text>
        <text x="694" y="826" font-size="8" fill="#9aa1aa">Preferences</text>
