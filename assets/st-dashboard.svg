      <rect x="1136" y="438" width="260" height="120" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
      <text x="1156" y="466" font-size="9" fill="#7d8590">LOW STOCK</text>
      <rect x="1356" y="452" width="20" height="20" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="1156" y="510" font-size="20" fill="#3a4049" font-weight="700">3</text>
      <text x="1156" y="540" font-size="9" fill="#c14545">↓ Cold Brew, Nitro, Brownie</text>
    </g>

