<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1640" preserveAspectRatio="xMidYMin meet" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace">

  <!-- Background -->
  <rect width="1280" height="1640" fill="#f7f7f8"/>

  <!-- Browser chrome / page frame -->
  <rect x="40" y="40" width="1200" height="1560" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>

  <!-- Browser address bar -->
  <rect x="40" y="40" width="1200" height="36" fill="#eef0f3" stroke="#cdd0d4" stroke-width="1"/>
  <circle cx="60" cy="58" r="5" fill="#d8dde3"/>
  <circle cx="78" cy="58" r="5" fill="#d8dde3"/>
  <circle cx="96" cy="58" r="5" fill="#d8dde3"/>
  <rect x="120" y="48" width="320" height="20" rx="4" fill="#ffffff" stroke="#d8dde3" stroke-width="1"/>
  <text x="135" y="62" font-size="11" fill="#7d8590">nettracepro.com</text>

  <!-- ============ NAV ============ -->
  <g>
    <rect x="40" y="76" width="1200" height="68" fill="#ffffff"/>
    <line x1="40" y1="144" x2="1240" y2="144" stroke="#e2e5e9" stroke-width="1"/>
    <!-- Logo -->
    <rect x="80" y="98" width="120" height="24" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="140" y="115" font-size="11" fill="#7d8590" text-anchor="middle">LOGO</text>
    <!-- Nav items -->
    <text x="780" y="116" font-size="13" fill="#3a4049">Services</text>
    <text x="870" y="116" font-size="13" fill="#3a4049">Pricing</text>
    <text x="950" y="116" font-size="13" fill="#3a4049">Portfolio</text>
    <text x="1040" y="116" font-size="13" fill="#3a4049">Contact</text>
    <!-- CTA pill -->
    <rect x="1115" y="98" width="100" height="28" rx="14" fill="#1a1d24"/>
    <text x="1165" y="116" font-size="11" fill="#ffffff" text-anchor="middle">Start →</text>
    <!-- Annotation -->
    <text x="80" y="170" font-size="10" fill="#c14545">[ NAV: 5 items + CTA pill, anchored top-left logo, top-right actions ]</text>
  </g>

  <!-- ============ HERO ============ -->
  <g>
    <rect x="40" y="144" width="1200" height="460" fill="#fafbfc"/>
    <!-- Eyebrow -->
    <rect x="280" y="220" width="240" height="14" fill="none" stroke="#a4abb4" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="400" y="231" font-size="10" fill="#7d8590" text-anchor="middle">EYEBROW · HOUSTON DIGITAL AGENCY</text>
    <!-- H1 — primary headline (largest box) -->
    <rect x="160" y="260" width="960" height="68" fill="#dee1e6"/>
    <text x="640" y="302" font-size="14" fill="#3a4049" text-anchor="middle" font-weight="600">H1 — PREMIUM WEBSITES WITHOUT THE PREMIUM PRICE</text>
    <!-- Subhead -->
    <rect x="280" y="340" width="720" height="20" fill="#e8ebef"/>
    <rect x="320" y="365" width="640" height="20" fill="#e8ebef"/>
    <text x="640" y="378" font-size="11" fill="#7d8590" text-anchor="middle">SUBHEAD — value prop, $1,500 starting, no retainers</text>
    <!-- Buttons row -->
    <rect x="440" y="430" width="180" height="44" rx="22" fill="#1a1d24"/>
    <text x="530" y="457" font-size="12" fill="#ffffff" text-anchor="middle">Primary CTA →</text>
    <rect x="640" y="430" width="180" height="44" rx="22" fill="none" stroke="#1a1d24" stroke-width="1.5"/>
    <text x="730" y="457" font-size="12" fill="#1a1d24" text-anchor="middle">See pricing</text>
    <!-- Trust strip -->
    <line x1="280" y1="540" x2="1000" y2="540" stroke="#cdd0d4" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="640" y="572" font-size="10" fill="#9aa1aa" text-anchor="middle">[ trust strip — client logos · 5 placeholders ]</text>
    <!-- Annotation -->
    <text x="80" y="200" font-size="10" fill="#c14545">[ HERO: single primary CTA, secondary outlined, anchored value prop ]</text>
  </g>

  <!-- ============ SERVICES ROW ============ -->
  <g>
    <line x1="40" y1="604" x2="1240" y2="604" stroke="#e2e5e9" stroke-width="1"/>
    <!-- Section heading -->
    <text x="640" y="660" font-size="11" fill="#7d8590" text-anchor="middle">SECTION HEADING — "WHAT WE BUILD"</text>
    <rect x="380" y="680" width="520" height="28" fill="#dee1e6"/>
    <text x="640" y="699" font-size="12" fill="#3a4049" text-anchor="middle">H2 — Three core services</text>

    <!-- 3-up cards -->
    <g>
      <!-- Card 1: Web -->
      <rect x="120" y="760" width="320" height="280" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="140" y="780" width="48" height="48" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="164" y="809" font-size="9" fill="#9aa1aa" text-anchor="middle">ICON</text>
      <rect x="140" y="848" width="220" height="20" fill="#dee1e6"/>
      <text x="250" y="862" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Web Design &amp; Development</text>
      <line x1="140" y1="888" x2="420" y2="888" stroke="#e2e5e9" stroke-width="1"/>
      <rect x="140" y="908" width="280" height="10" fill="#eef0f3"/>
      <rect x="140" y="924" width="240" height="10" fill="#eef0f3"/>
      <rect x="140" y="940" width="260" height="10" fill="#eef0f3"/>
      <rect x="140" y="980" width="100" height="14" fill="none" stroke="#1a1d24" stroke-width="1"/>
      <text x="190" y="990" font-size="9" fill="#1a1d24" text-anchor="middle">Learn more →</text>

      <!-- Card 2: Mobile -->
      <rect x="480" y="760" width="320" height="280" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="500" y="780" width="48" height="48" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="524" y="809" font-size="9" fill="#9aa1aa" text-anchor="middle">ICON</text>
      <rect x="500" y="848" width="220" height="20" fill="#dee1e6"/>
      <text x="610" y="862" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Mobile App Development</text>
      <line x1="500" y1="888" x2="780" y2="888" stroke="#e2e5e9" stroke-width="1"/>
      <rect x="500" y="908" width="280" height="10" fill="#eef0f3"/>
      <rect x="500" y="924" width="240" height="10" fill="#eef0f3"/>
      <rect x="500" y="940" width="260" height="10" fill="#eef0f3"/>
      <rect x="500" y="980" width="100" height="14" fill="none" stroke="#1a1d24" stroke-width="1"/>
      <text x="550" y="990" font-size="9" fill="#1a1d24" text-anchor="middle">Learn more →</text>

      <!-- Card 3: SEO -->
      <rect x="840" y="760" width="320" height="280" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="860" y="780" width="48" height="48" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="884" y="809" font-size="9" fill="#9aa1aa" text-anchor="middle">ICON</text>
      <rect x="860" y="848" width="220" height="20" fill="#dee1e6"/>
      <text x="970" y="862" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Search Engine Optimization</text>
      <line x1="860" y1="888" x2="1140" y2="888" stroke="#e2e5e9" stroke-width="1"/>
      <rect x="860" y="908" width="280" height="10" fill="#eef0f3"/>
      <rect x="860" y="924" width="240" height="10" fill="#eef0f3"/>
      <rect x="860" y="940" width="260" height="10" fill="#eef0f3"/>
      <rect x="860" y="980" width="100" height="14" fill="none" stroke="#1a1d24" stroke-width="1"/>
      <text x="910" y="990" font-size="9" fill="#1a1d24" text-anchor="middle">Learn more →</text>
    </g>
    <!-- Annotation -->
    <text x="80" y="640" font-size="10" fill="#c14545">[ 3-up service grid · equal weight, deep links into each service detail page ]</text>
  </g>

  <!-- ============ PRICING TEASER ============ -->
  <g>
    <line x1="40" y1="1080" x2="1240" y2="1080" stroke="#e2e5e9" stroke-width="1"/>
    <text x="640" y="1130" font-size="11" fill="#7d8590" text-anchor="middle">PRICING TEASER — anchor on $1,500 starting</text>
    <rect x="400" y="1150" width="480" height="32" fill="#dee1e6"/>
    <text x="640" y="1171" font-size="12" fill="#3a4049" text-anchor="middle" font-weight="600">H2 — Honest pricing. No surprises.</text>
    <rect x="320" y="1200" width="640" height="14" fill="#e8ebef"/>
    <rect x="380" y="1220" width="520" height="14" fill="#e8ebef"/>
    <rect x="540" y="1280" width="200" height="44" rx="22" fill="#1a1d24"/>
    <text x="640" y="1308" font-size="12" fill="#ffffff" text-anchor="middle">View full pricing →</text>
    <!-- Annotation -->
    <text x="80" y="1110" font-size="10" fill="#c14545">[ pricing teaser — defuses "agency = expensive" objection early ]</text>
  </g>

  <!-- ============ PORTFOLIO TEASE ============ -->
  <g>
    <line x1="40" y1="1380" x2="1240" y2="1380" stroke="#e2e5e9" stroke-width="1"/>
    <text x="640" y="1420" font-size="11" fill="#7d8590" text-anchor="middle">RECENT WORK — 4 thumbnails grid</text>
    <!-- 4 thumbnail placeholders -->
    <rect x="120" y="1440" width="240" height="140" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="240" y="1514" font-size="10" fill="#9aa1aa" text-anchor="middle">PROJECT 1</text>
    <rect x="380" y="1440" width="240" height="140" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="500" y="1514" font-size="10" fill="#9aa1aa" text-anchor="middle">PROJECT 2</text>
    <rect x="640" y="1440" width="240" height="140" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="760" y="1514" font-size="10" fill="#9aa1aa" text-anchor="middle">PROJECT 3</text>
    <rect x="900" y="1440" width="240" height="140" fill="none" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="1020" y="1514" font-size="10" fill="#9aa1aa" text-anchor="middle">PROJECT 4</text>
  </g>

</svg>