<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMin meet" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace">

  <!-- Arrowhead marker for flow lines -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4049"/>
    </marker>
  </defs>

  <rect width="1280" height="800" fill="#f7f7f8"/>
  <rect x="40" y="40" width="1200" height="720" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>

  <!-- Title strip -->
  <rect x="40" y="40" width="1200" height="44" fill="#eef0f3" stroke="#cdd0d4" stroke-width="1"/>
  <text x="68" y="68" font-size="12" fill="#3a4049" font-weight="600">USER FLOW — Lead conversion path</text>
  <text x="1212" y="68" font-size="11" fill="#7d8590" text-anchor="end">Primary persona · small business owner</text>

  <!-- Persona context -->
  <text x="80" y="118" font-size="10" fill="#c14545">[ user goal: get a quote without filling out 12 fields · business goal: capture qualified lead with project scope ]</text>

  <!-- ============ FLOW STEPS ============ -->
  <!-- Step 1: Entry (search ad / referral) -->
  <g>
    <rect x="80" y="180" width="160" height="80" rx="6" fill="#ffffff" stroke="#3a4049" stroke-width="1.5"/>
    <text x="160" y="208" font-size="10" fill="#9aa1aa" text-anchor="middle">START</text>
    <text x="160" y="228" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Search / referral</text>
    <text x="160" y="246" font-size="9" fill="#7d8590" text-anchor="middle">Google ad · word of mouth</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="240" y1="220" x2="320" y2="220" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Homepage -->
  <g>
    <rect x="320" y="180" width="160" height="80" rx="6" fill="#ffffff" stroke="#3a4049" stroke-width="1.5"/>
    <text x="400" y="208" font-size="10" fill="#9aa1aa" text-anchor="middle">SCREEN 1</text>
    <text x="400" y="228" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Homepage</text>
    <text x="400" y="246" font-size="9" fill="#7d8590" text-anchor="middle">Hero · services · pricing teaser</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="480" y1="220" x2="560" y2="220" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond: Knows what they need? -->
  <g>
    <polygon points="640,170 740,220 640,270 540,220" fill="#fafbfc" stroke="#3a4049" stroke-width="1.5"/>
    <text x="640" y="208" font-size="9" fill="#9aa1aa" text-anchor="middle">DECISION</text>
    <text x="640" y="226" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Knows scope?</text>
  </g>

  <!-- YES branch — direct to Contact -->
  <line x1="740" y1="220" x2="820" y2="220" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="780" y="208" font-size="9" fill="#3a4049" text-anchor="middle" font-weight="600">YES</text>

  <!-- NO branch — go to Pricing first -->
  <line x1="640" y1="270" x2="640" y2="340" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="310" font-size="9" fill="#3a4049">NO</text>

  <!-- Step 4a: Pricing page (NO branch) -->
  <g>
    <rect x="560" y="340" width="160" height="80" rx="6" fill="#ffffff" stroke="#3a4049" stroke-width="1.5"/>
    <text x="640" y="368" font-size="10" fill="#9aa1aa" text-anchor="middle">SCREEN 2A</text>
    <text x="640" y="388" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Pricing</text>
    <text x="640" y="406" font-size="9" fill="#7d8590" text-anchor="middle">Tier comparison · FAQ</text>
  </g>

  <!-- Arrow from Pricing back up to Contact path -->
  <line x1="720" y1="380" x2="900" y2="380" stroke="#3a4049" stroke-width="1.5" fill="none"/>
  <line x1="900" y1="380" x2="900" y2="270" stroke="#3a4049" stroke-width="1.5" fill="none"/>
  <line x1="900" y1="270" x2="900" y2="270" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4b: Contact form (YES branch + Pricing return) -->
  <g>
    <rect x="820" y="180" width="160" height="80" rx="6" fill="#ffffff" stroke="#3a4049" stroke-width="1.5"/>
    <text x="900" y="208" font-size="10" fill="#9aa1aa" text-anchor="middle">SCREEN 3</text>
    <text x="900" y="228" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Contact form</text>
    <text x="900" y="246" font-size="9" fill="#7d8590" text-anchor="middle">Name · email · scope · budget</text>
  </g>

  <!-- Arrow Contact → Submit -->
  <line x1="980" y1="220" x2="1060" y2="220" stroke="#3a4049" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Submitted (terminal) -->
  <g>
    <rect x="1060" y="180" width="160" height="80" rx="6" fill="#dee1e6" stroke="#3a4049" stroke-width="1.5"/>
    <text x="1140" y="208" font-size="10" fill="#9aa1aa" text-anchor="middle">END</text>
    <text x="1140" y="228" font-size="11" fill="#3a4049" text-anchor="middle" font-weight="600">Lead submitted</text>
    <text x="1140" y="246" font-size="9" fill="#7d8590" text-anchor="middle">Thank-you screen · 24hr promise</text>
  </g>

  <!-- Annotation by terminal -->
  <text x="1140" y="285" font-size="10" fill="#c14545" text-anchor="middle">[ conversion goal ]</text>

  <!-- ============ SECONDARY FLOW (Portfolio path for trust building) ============ -->
  <text x="80" y="500" font-size="10" fill="#3a4049" font-weight="600">SECONDARY PATH — trust-building before conversion</text>

  <!-- Homepage -->
  <g>
    <rect x="80" y="530" width="160" height="60" rx="6" fill="#ffffff" stroke="#9aa1aa" stroke-width="1"/>
    <text x="160" y="552" font-size="9" fill="#9aa1aa" text-anchor="middle">SCREEN 1</text>
    <text x="160" y="572" font-size="11" fill="#3a4049" text-anchor="middle">Homepage</text>
  </g>
  <line x1="240" y1="560" x2="320" y2="560" stroke="#9aa1aa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Portfolio -->
  <g>
    <rect x="320" y="530" width="160" height="60" rx="6" fill="#ffffff" stroke="#9aa1aa" stroke-width="1"/>
    <text x="400" y="552" font-size="9" fill="#9aa1aa" text-anchor="middle">SCREEN 4</text>
    <text x="400" y="572" font-size="11" fill="#3a4049" text-anchor="middle">Portfolio grid</text>
  </g>
  <line x1="480" y1="560" x2="560" y2="560" stroke="#9aa1aa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Case study -->
  <g>
    <rect x="560" y="530" width="160" height="60" rx="6" fill="#ffffff" stroke="#9aa1aa" stroke-width="1"/>
    <text x="640" y="552" font-size="9" fill="#9aa1aa" text-anchor="middle">SCREEN 5</text>
    <text x="640" y="572" font-size="11" fill="#3a4049" text-anchor="middle">Case detail</text>
  </g>
  <line x1="720" y1="560" x2="800" y2="560" stroke="#9aa1aa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Contact form -->
  <g>
    <rect x="800" y="530" width="160" height="60" rx="6" fill="#ffffff" stroke="#9aa1aa" stroke-width="1"/>
    <text x="880" y="552" font-size="9" fill="#9aa1aa" text-anchor="middle">SCREEN 3</text>
    <text x="880" y="572" font-size="11" fill="#3a4049" text-anchor="middle">Contact form</text>
  </g>
  <line x1="960" y1="560" x2="1040" y2="560" stroke="#9aa1aa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Conversion -->
  <g>
    <rect x="1040" y="530" width="160" height="60" rx="6" fill="#dee1e6" stroke="#9aa1aa" stroke-width="1"/>
    <text x="1120" y="552" font-size="9" fill="#9aa1aa" text-anchor="middle">END</text>
    <text x="1120" y="572" font-size="11" fill="#3a4049" text-anchor="middle">Lead submitted</text>
  </g>

  <text x="80" y="640" font-size="10" fill="#c14545">[ longer path · skeptical user · proves credibility before contact ]</text>

  <!-- Footer -->
  <line x1="80" y1="700" x2="1200" y2="700" stroke="#e2e5e9" stroke-width="1"/>
  <text x="80" y="725" font-size="10" fill="#3a4049" font-weight="600">DESIGN PRINCIPLE</text>
  <text x="80" y="745" font-size="10" fill="#7d8590">Every page has a path to Contact within one click. No dead ends. No forced sequences.</text>

</svg>