    <text x="808" y="360" font-size="11" fill="#3a4049" font-weight="600">Cash Customer · Walk-in</text>
    <text x="1360" y="354" font-size="10" fill="#5e7eb6" text-anchor="end">Change →</text>

    <!-- Catalog split: categories left, items right -->
    <!-- Categories col -->
    <rect x="760" y="396" width="180" height="440" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <rect x="760" y="396" width="180" height="32" fill="#eef0f3"/>
    <text x="775" y="416" font-size="10" fill="#7d8590" font-weight="600">CATEGORIES</text>

    <rect x="760" y="428" width="180" height="36" fill="#dee1e6"/>
    <text x="775" y="450" font-size="10" fill="#3a4049" font-weight="600">All</text>
    <rect x="760" y="464" width="180" height="36" fill="#ffffff"/>
    <text x="775" y="486" font-size="10" fill="#3a4049">Coffee</text>
    <rect x="760" y="500" width="180" height="36" fill="#ffffff"/>
    <text x="775" y="522" font-size="10" fill="#3a4049">Tea</text>
    <rect x="760" y="536" width="180" height="36" fill="#ffffff"/>
    <text x="775" y="558" font-size="10" fill="#3a4049">Pastries</text>
    <rect x="760" y="572" width="180" height="36" fill="#ffffff"/>
    <text x="775" y="594" font-size="10" fill="#3a4049">Sandwiches</text>
    <rect x="760" y="608" width="180" height="36" fill="#ffffff"/>
    <text x="775" y="630" font-size="10" fill="#3a4049">Drinks</text>

    <!-- Items col -->
    <rect x="956" y="396" width="424" height="440" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <rect x="956" y="396" width="424" height="32" fill="#eef0f3"/>
    <text x="971" y="416" font-size="10" fill="#7d8590" font-weight="600">ITEMS</text>

    <!-- Items grid 3 cols -->
    <g>
      <rect x="972" y="444" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="988" y="456" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1032" y="492" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1032" y="534" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Espresso</text>
      <text x="1032" y="548" font-size="9" fill="#5cb85c" text-anchor="middle">$3.50</text>

      <rect x="1108" y="444" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1124" y="456" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1168" y="492" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1168" y="534" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Cappuccino</text>
      <text x="1168" y="548" font-size="9" fill="#5cb85c" text-anchor="middle">$4.50</text>

      <rect x="1244" y="444" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1260" y="456" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1304" y="492" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1304" y="534" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Latte</text>
      <text x="1304" y="548" font-size="9" fill="#5cb85c" text-anchor="middle">$4.75</text>

      <rect x="972" y="572" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="988" y="584" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1032" y="620" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1032" y="662" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Americano</text>
      <text x="1032" y="676" font-size="9" fill="#5cb85c" text-anchor="middle">$3.75</text>

      <rect x="1108" y="572" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1124" y="584" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1168" y="620" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1168" y="662" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Mocha</text>
      <text x="1168" y="676" font-size="9" fill="#5cb85c" text-anchor="middle">$5.00</text>

      <rect x="1244" y="572" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1260" y="584" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1304" y="620" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1304" y="662" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Croissant</text>
      <text x="1304" y="676" font-size="9" fill="#5cb85c" text-anchor="middle">$3.25</text>

      <rect x="972" y="700" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="988" y="712" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1032" y="748" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1032" y="790" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Muffin</text>
      <text x="1032" y="804" font-size="9" fill="#5cb85c" text-anchor="middle">$2.75</text>

      <rect x="1108" y="700" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1124" y="712" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1168" y="748" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1168" y="790" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Sandwich</text>
      <text x="1168" y="804" font-size="9" fill="#5cb85c" text-anchor="middle">$8.50</text>

      <rect x="1244" y="700" width="120" height="116" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
      <rect x="1260" y="712" width="88" height="60" fill="#ffffff" stroke="#9aa1aa" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="1304" y="748" font-size="9" fill="#9aa1aa" text-anchor="middle">IMG</text>
      <text x="1304" y="790" font-size="10" fill="#3a4049" text-anchor="middle" font-weight="600">Bagel</text>
      <text x="1304" y="804" font-size="9" fill="#5cb85c" text-anchor="middle">$3.50</text>
    </g>

    <!-- Charge button (large, primary) -->
    <rect x="760" y="852" width="620" height="64" rx="8" fill="#5cb85c"/>
    <text x="1070" y="892" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Charge $0.00 →</text>
    <text x="760" y="940" font-size="10" fill="#c14545">[ Charge button: green = "go" · disabled when total = $0 · biggest target on the screen ]</text>
  </g>

  <!-- Right-side annotations -->
  <g fill="#c14545" font-size="10">
    <line x1="1390" y1="284" x2="1410" y2="284" stroke="#c14545" stroke-width="1"/>
    <text x="1420" y="282">Search + barcode</text>
    <text x="1420" y="296">scan share input</text>

    <line x1="1390" y1="354" x2="1410" y2="354" stroke="#c14545" stroke-width="1"/>
    <text x="1420" y="352">Customer = "Walk-in"</text>
    <text x="1420" y="366">by default · 1-click</text>
    <text x="1420" y="380">to attach a CRM record</text>

    <line x1="1390" y1="500" x2="1410" y2="500" stroke="#c14545" stroke-width="1"/>
    <text x="1420" y="498">Categories pin left,</text>
    <text x="1420" y="512">items grid scrolls,</text>
    <text x="1420" y="526">tap = add to order</text>
  </g>

</svg>