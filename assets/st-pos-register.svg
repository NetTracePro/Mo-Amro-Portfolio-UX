    <rect x="740" y="240" width="660" height="700" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>

    <!-- Search bar -->
    <rect x="760" y="260" width="540" height="40" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <text x="775" y="284" font-size="10" fill="#9aa1aa">🔍 Search items or scan barcode…</text>
    <rect x="1308" y="260" width="72" height="40" fill="#fafbfc" stroke="#cdd0d4" stroke-width="1"/>
    <text x="1344" y="284" font-size="10" fill="#7d8590" text-anchor="middle">⌨</text>

    <!-- Customer banner -->
    <rect x="760" y="320" width="620" height="56" fill="#ffffff" stroke="#cdd0d4" stroke-width="1"/>
    <circle cx="784" cy="348" r="14" fill="#dee1e6"/>
